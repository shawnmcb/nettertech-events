components:
  securitySchemes:
    WordPressCookie:
      type: apiKey
      in: cookie
      name: wordpress_logged_in
      description: WordPress authentication cookie

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimitExceeded:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Error'
              - type: object
                properties:
                  data:
                    type: object
                    properties:
                      retry_after:
                        type: integer
                        description: Seconds until rate limit resets
          example:
            code: "rate_limit_exceeded"
            message: "Too many requests. Please try again later."
            data:
              status: 429
              retry_after: 45

  schemas:
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error code
        message:
          type: string
          description: Human-readable error message
        data:
          type: object
          properties:
            status:
              type: integer
              description: HTTP status code

    OccurrenceWithEvent:
      type: object
      description: An occurrence with embedded event details and ticket availability
      properties:
        id:
          type: integer
          description: Occurrence ID
        event_id:
          type: integer
        start_datetime:
          type: string
          format: date-time
        end_datetime:
          type: string
          format: date-time
        all_day:
          type: boolean
        status:
          type: string
          enum: [published, cancelled]
        formatted:
          type: object
          description: Pre-formatted date/time strings for display
          properties:
            date:
              type: string
              description: Formatted date (e.g., "February 15, 2026")
            time:
              type: string
              description: Formatted time range (e.g., "7:00 PM - 10:00 PM")
            date_range:
              type: string
              description: Formatted date range for multi-day events
        event:
          type: object
          properties:
            id:
              type: integer
            title:
              type: string
            slug:
              type: string
            excerpt:
              type: string
            venue_name:
              type: string
            venue_address:
              type: string
            permalink:
              type: string
              format: uri
            image:
              type: object
              nullable: true
              properties:
                id:
                  type: integer
                url:
                  type: string
                  format: uri
                width:
                  type: integer
                height:
                  type: integer
                full:
                  type: string
                  format: uri
                alt:
                  type: string
        tickets:
          type: object
          description: Ticket availability summary
          properties:
            available:
              type: boolean
              description: Whether any tickets are available
            sold_out:
              type: boolean
              description: Whether all ticket types are sold out
            low_stock:
              type: boolean
              description: Whether any ticket type is low on stock
            min_price:
              type: number
              format: float
              nullable: true
            max_price:
              type: number
              format: float
              nullable: true
            total_left:
              type: integer
              nullable: true
              description: Total tickets remaining (null if unlimited)
            types:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  price:
                    type: number
                  available:
                    type: integer
                  sold_out:
                    type: boolean
                  low_stock:
                    type: boolean
                  unlimited:
                    type: boolean

    PaginatedOccurrences:
      type: object
      description: Paginated response for occurrences list
      properties:
        events:
          type: array
          items:
            $ref: '#/components/schemas/OccurrenceWithEvent'
        total:
          type: integer
          description: Total number of occurrences matching the query
        total_pages:
          type: integer
          description: Total number of pages
        page:
          type: integer
          description: Current page number
        per_page:
          type: integer
          description: Results per page

    PublicEvent:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        short_description:
          type: string
        featured_image:
          type: string
          format: uri
        venue:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            name:
              type: string
            address:
              type: string
        occurrences:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              start_datetime:
                type: string
                format: date-time
              end_datetime:
                type: string
                format: date-time
              status:
                type: string
        categories:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              slug:
                type: string
        _links:
          type: object

    AdminEvent:
      allOf:
        - $ref: '#/components/schemas/PublicEvent'
        - type: object
          properties:
            status:
              type: string
              enum: [draft, published, cancelled]
            organizer_id:
              type: integer
              nullable: true
            recurrence_rule:
              type: string
              nullable: true
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    EventInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          description: Auto-generated from title if not provided
        description:
          type: string
        short_description:
          type: string
          maxLength: 500
        venue_id:
          type: integer
          nullable: true
        organizer_id:
          type: integer
          nullable: true
        featured_image_id:
          type: integer
          nullable: true
        status:
          type: string
          enum: [draft, published, cancelled]
          default: draft
        recurrence_rule:
          type: string
          description: RFC 5545 RRULE
          nullable: true
        category_ids:
          type: array
          items:
            type: integer
        tag_ids:
          type: array
          items:
            type: integer

    Attendee:
      type: object
      properties:
        id:
          type: integer
        occurrence_id:
          type: integer
        ticket_type_id:
          type: integer
          nullable: true
        wc_order_id:
          type: integer
          nullable: true
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
          nullable: true
        quantity:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [pending, confirmed, cancelled, refunded]
        checked_in:
          type: boolean
        checked_in_count:
          type: integer
        checked_in_at:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        accessibility_notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        _links:
          type: object

    AttendeeInput:
      type: object
      required:
        - occurrence_id
        - name
        - email
      properties:
        occurrence_id:
          type: integer
        ticket_type_id:
          type: integer
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        phone:
          type: string
        quantity:
          type: integer
          minimum: 1
          default: 1
        status:
          type: string
          enum: [pending, confirmed, cancelled, refunded]
          default: confirmed
        notes:
          type: string
        accessibility_notes:
          type: string

    CheckInAttendee:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        quantity:
          type: integer
        checked_in:
          type: boolean
        checked_in_count:
          type: integer
        ticket_type:
          type: string
          nullable: true

    CheckInResult:
      type: object
      properties:
        success:
          type: boolean
        attendee_id:
          type: integer
        checked_in_count:
          type: integer
        fully_checked_in:
          type: boolean
        message:
          type: string

    AdminCheckInResponse:
      type: object
      properties:
        id:
          type: integer
        checked_in:
          type: boolean
        checked_in_count:
          type: integer
        quantity:
          type: integer
        checked_in_at:
          type: string
          nullable: true

    TicketType:
      type: object
      properties:
        id:
          type: integer
        occurrence_id:
          type: integer
          nullable: true
        event_id:
          type: integer
          nullable: true
        scope:
          type: string
          enum: [occurrence, event, template]
        template_id:
          type: integer
          nullable: true
        name:
          type: string
        description:
          type: string
