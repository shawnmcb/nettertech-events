                recurrence_rule: "FREQ=WEEKLY;BYDAY=SA;COUNT=8"
                created_at: "2026-01-17T10:30:00Z"
                updated_at: "2026-01-17T10:30:00Z"
          headers:
            Location:
              description: URL of created resource
              schema:
                type: string
                format: uri
              example: "/wp-json/nettertech-events/v1/admin/events/12"
