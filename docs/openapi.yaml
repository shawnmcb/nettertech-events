openapi: 3.0.3
info:
  title: NetterTech Events REST API
  description: |
    REST API for the NetterTech Events WordPress plugin.

    ## Scope & Status

    This specification is being incrementally reconciled with the implementation in
    `includes/API/`. As of 2026-04-20, the core plugin ships exactly these 20 routes
    across 7 controllers (verified via `grep register_rest_route includes/API`):

    | Controller | Routes |
    |------------|--------|
    | EventsController | `GET /events/upcoming`, `GET /events/range`, `GET /events/{id}`, `GET /occurrences` |
    | ICalController | `GET /ical/feed`, `GET /ical/event/{id}`, `GET /ical/occurrence/{id}`, `POST /ical/import` |
    | WaitlistRestController | `POST /waitlist/join`, `GET /waitlist/status`, `POST /waitlist/leave` |
    | AttendeeFieldsController | `GET/POST /events/{event_id}/attendee-fields`, `GET/PATCH/DELETE /events/{event_id}/attendee-fields/{id}`, `GET /attendees/{attendee_id}/custom-fields` |
    | EventsAdminController | `GET/POST /admin/events`, `GET/PATCH/DELETE /admin/events/{id}` |
    | AttendeesAdminController | `GET/POST /admin/attendees`, `GET/PATCH/DELETE /admin/attendees/{id}` |
    | TicketTypesAdminController | `GET/POST /admin/ticket-types`, `GET/PATCH/DELETE /admin/ticket-types/{id}` |

    Routes listed below with the `Check-In` or `Check-In (Admin)` tag are documented
    here for historical reference but are **not registered by the core plugin** — they
    belong to the NetterTech Events Pro add-on and are registered by that plugin's own
    controllers (QR check-in, volunteer scan, check-in reporting). Integrations that
    need those routes must ensure Pro is installed and active. The core `GET /events`
    list endpoint listed here is also not implemented — public event listing is via
    `GET /events/upcoming` or `GET /events/range`.

    A structural rewrite that removes the non-core routes and adds the missing
    Waitlist and Attendee-Fields operations is tracked in the documentation backlog.

    ## Authentication

    Admin endpoints require WordPress authentication with `manage_options` capability.
    Use WordPress REST API authentication methods (cookie, application password, or nonce).

    Public endpoints require no authentication.

    Check-in endpoints use token-based authentication via URL parameter.

    ## Rate Limiting

    All endpoints are rate-limited using a sliding window algorithm:
    - Default: 60 requests per minute per IP
    - Admin bypass: Authenticated users with `edit_posts` capability bypass rate limiting

    **Admin Bypass Behavior:**
    Rate limiting is applied to all endpoints for defense in depth. However, authenticated
    WordPress administrators (users with `edit_posts` capability) bypass rate limit checks
    entirely. This allows admin workflows that may involve rapid successive API calls
    (e.g., bulk operations, CSV exports) without hitting rate limits.

    When rate limited, responses include:
    - HTTP 429 status
    - `retry_after` field indicating seconds to wait

    ## Request Signing (Optional)

    Sensitive endpoints may include HMAC signatures for data integrity verification.
    When present, responses include:
    - `X-VE-Signature`: HMAC-SHA256 signature of the response body
    - `X-VE-Timestamp`: Unix timestamp when signature was created

    **Verification Process:**
    1. Extract signature and timestamp from headers
    2. Check timestamp is within 5 minutes (replay protection)
    3. Compute HMAC-SHA256 of `{timestamp}.{response_body}` using shared secret
    4. Compare computed signature with `X-VE-Signature` (timing-safe)

    The signing service is available for integrations that require tamper-proof responses,
    such as check-in token generation and sensitive attendee data.

    ## Error Responses

    All errors follow WordPress REST API conventions:
    ```json
    {
      "code": "error_code",
      "message": "Human readable message",
      "data": { "status": 400 }
    }
    ```
  version: 1.0.0
  contact:
    name: NetterTech Events Support
  license:
    name: GPL-2.0-or-later
    url: https://www.gnu.org/licenses/gpl-2.0.html

servers:
  - url: /wp-json/nettertech-events/v1
    description: WordPress REST API base

tags:
  - name: Events (Public)
    description: Public read-only access to events
  - name: Occurrences (Public)
    description: Public access to event occurrences with filtering
  - name: iCal (Public)
    description: Calendar feed and export endpoints
  - name: iCal (Admin)
    description: iCal import (requires manage_options)
  - name: Check-In
    description: Attendee check-in operations (token-authenticated)
  - name: Check-In (Admin)
    description: Admin check-in operations (requires edit_posts)
  - name: Events (Admin)
    description: Full event management (requires manage_options)
  - name: Attendees (Admin)
    description: Attendee management (requires manage_options)
  - name: Ticket Types (Admin)
    description: Ticket type management (requires manage_options)

paths:
  /events:
    get:
      tags:
        - Events (Public)
      summary: List published events
      security: []
      description: |
        Returns a list of published events with their occurrences.
        Supports filtering by date range, venue, and category.
      operationId: getPublicEvents
      parameters:
        - name: start_date
          in: query
          description: Filter events starting on or after this date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: end_date
          in: query
          description: Filter events ending on or before this date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: venue_id
          in: query
          description: Filter by venue ID
          schema:
            type: integer
        - name: category_id
          in: query
          description: Filter by category ID
          schema:
            type: integer
        - name: per_page
          in: query
          description: Results per page
          schema:
            type: integer
            default: 10
            maximum: 100
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
      responses:
        '200':
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublicEvent'
              example:
                - id: 5
                  title: "Summer Concert Series"
                  slug: "summer-concert-series"
                  description: "An outdoor summer concert featuring local bands and musicians."
                  short_description: "Outdoor summer concert with local bands"
                  featured_image: "https://example.com/wp-content/uploads/summer-concert.jpg"
                  venue:
                    id: 1
                    name: "Community Arts Center"
                    address: "123 Main Street, Anytown, ST 12345"
                  occurrences:
                    - id: 42
                      start_datetime: "2026-02-15T19:00:00-06:00"
                      end_datetime: "2026-02-15T22:00:00-06:00"
                      status: "published"
                    - id: 43
                      start_datetime: "2026-03-15T19:00:00-06:00"
                      end_datetime: "2026-03-15T22:00:00-06:00"
                      status: "published"
                  categories:
                    - id: 2
                      name: "Music"
                      slug: "music"
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /events/{id}:
    get:
      tags:
        - Events (Public)
      summary: Get a single event
      security: []
      description: Returns details for a single published event
      operationId: getPublicEvent
      parameters:
        - name: id
          in: path
          required: true
          description: Event ID
          schema:
            type: integer
      responses:
        '200':
          description: Event details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicEvent'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /events/upcoming:
    get:
      tags:
        - Events (Public)
      summary: Get upcoming events
      security: []
      description: |
        Returns upcoming events/occurrences sorted by start date.
        Useful for homepage widgets and "upcoming events" sections.
      operationId: getUpcomingEvents
      parameters:
        - name: limit
          in: query
          description: Maximum number of events to return
          schema:
            type: integer
            default: 10
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: List of upcoming occurrences with event details
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OccurrenceWithEvent'
              example:
                - id: 42
                  event_id: 5
                  start_datetime: "2026-02-15T19:00:00-06:00"
                  end_datetime: "2026-02-15T22:00:00-06:00"
                  all_day: false
                  status: "published"
                  formatted:
                    date: "February 15, 2026"
                    time: "7:00 PM - 10:00 PM"
                    date_range: "February 15, 2026"
                  event:
                    id: 5
                    title: "Summer Concert Series"
                    slug: "summer-concert-series"
                    excerpt: "An outdoor summer concert with local bands"
                    venue_name: "Community Arts Center"
                    venue_address: "123 Main Street, Anytown, ST"
                    permalink: "https://example.com/events/summer-concert-series/"
                    image:
                      id: 123
                      url: "https://example.com/wp-content/uploads/event.jpg"
                      width: 800
                      height: 600
                      full: "https://example.com/wp-content/uploads/event-full.jpg"
                      alt: "Summer concert performance"
                  tickets:
                    available: true
                    sold_out: false
                    low_stock: false
                    min_price: 15.00
                    max_price: 35.00
                    total_left: 45
                    types: []
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /events/range:
    get:
      tags:
        - Events (Public)
      summary: Get events in date range
      security: []
      description: |
        Returns events/occurrences within a specified date range.
        Useful for calendar views.
      operationId: getEventsInRange
      parameters:
        - name: start
          in: query
          required: true
          description: Start date (ISO 8601 format YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: end
          in: query
          required: true
          description: End date (ISO 8601 format YYYY-MM-DD)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: List of occurrences in the date range
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OccurrenceWithEvent'
        '400':
          description: Missing or invalid date parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: "invalid_params"
                message: "Start and end dates are required."
                data:
                  status: 400
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /occurrences:
    get:
      tags:
        - Occurrences (Public)
      summary: Get occurrences with filtering
      security: []
      description: |
        Returns occurrences with pagination and filtering support.
        Supports two modes:
        1. **Date range mode** (start/end params) - for calendar views
        2. **Paginated mode** (page/per_page params) - for grid/list views
      operationId: getOccurrences
      parameters:
        - name: start
          in: query
          description: Start date for calendar range (ISO 8601). If provided with `end`, returns all occurrences in range.
          schema:
            type: string
            format: date
        - name: end
          in: query
          description: End date for calendar range (ISO 8601)
          schema:
            type: string
            format: date
        - name: page
          in: query
          description: Page number (for paginated mode)
          schema:
            type: integer
            default: 1
            minimum: 1
        - name: per_page
          in: query
          description: Results per page (for paginated mode)
          schema:
            type: integer
            default: 12
            minimum: 1
            maximum: 100
        - name: category
          in: query
          description: Filter by category ID(s)
          schema:
            oneOf:
              - type: integer
              - type: array
                items:
                  type: integer
        - name: search
          in: query
          description: Search in event title
          schema:
            type: string
        - name: upcoming
          in: query
          description: Return only upcoming events (default true)
          schema:
            type: boolean
            default: true
        - name: past
          in: query
          description: Return past events only (overrides upcoming)
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: |
            Paginated list of occurrences (when using page/per_page) or
            array of occurrences (when using start/end date range)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/PaginatedOccurrences'
                  - type: array
                    items:
                      $ref: '#/components/schemas/OccurrenceWithEvent'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /ical/feed:
    get:
      tags:
        - iCal (Public)
      summary: Get calendar feed
      security: []
      description: |
        Returns an iCal calendar feed of published events.
        Use this URL for calendar subscriptions (Google Calendar, Apple Calendar, Outlook).
      operationId: getICalFeed
      parameters:
        - name: limit
          in: query
          description: Maximum number of events
          schema:
            type: integer
            default: 100
            minimum: 1
            maximum: 500
        - name: start_from
          in: query
          description: Start date (ISO 8601), defaults to today
          schema:
            type: string
            format: date
        - name: category
          in: query
          description: Filter by category ID(s)
          schema:
            oneOf:
              - type: integer
              - type: array
                items:
                  type: integer
      responses:
        '200':
          description: iCal calendar feed
          content:
            text/calendar:
              schema:
                type: string
              example: |
                BEGIN:VCALENDAR
                VERSION:2.0
                PRODID:-//NetterTech Events//EN
                BEGIN:VEVENT
                UID:event-5-42@example.com
                DTSTART:20260215T190000
                DTEND:20260215T220000
                SUMMARY:Summer Concert Series
                LOCATION:Community Arts Center, 123 Main Street, Anytown, ST
                END:VEVENT
                END:VCALENDAR
        '429':
          $ref: '#/components/responses/RateLimitExceeded'

  /ical/event/{id}:
    get:
      tags:
        - iCal (Public)
      summary: Export event as iCal
      security: []
      description: Download a single event (all occurrences) as an iCal file
      operationId: getICalEvent
      parameters:
        - name: id
          in: path
          required: true
          description: Event ID
          schema:
            type: integer
      responses:
        '200':
          description: iCal file download
          content:
            text/calendar:
              schema:
                type: string
          headers:
            Content-Disposition:
              description: Attachment filename
              schema:
                type: string
                example: 'attachment; filename="summer-concert-series.ics"'
        '403':
          description: Event is not published
        '404':
          $ref: '#/components/responses/NotFound'

  /ical/occurrence/{id}:
    get:
      tags:
        - iCal (Public)
      summary: Export occurrence as iCal
      security: []
      description: Download a single occurrence as an iCal file
      operationId: getICalOccurrence
      parameters:
        - name: id
          in: path
          required: true
          description: Occurrence ID
          schema:
            type: integer
      responses:
        '200':
          description: iCal file download
          content:
            text/calendar:
              schema:
                type: string
          headers:
            Content-Disposition:
              description: Attachment filename
              schema:
                type: string
                example: 'attachment; filename="summer-concert-series-42.ics"'
        '403':
          description: Event is not published
        '404':
          $ref: '#/components/responses/NotFound'

  /ical/import:
    post:
      tags:
        - iCal (Admin)
      summary: Import events from iCal
      description: Import events from iCal content (requires manage_options capability)
      operationId: importICal
      security:
        - WordPressCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  description: iCal file content
                status:
                  type: string
                  enum: [draft, published]
                  default: draft
                  description: Status for imported events
                skip_duplicates:
                  type: boolean
                  default: true
                  description: Skip events that already exist (by UID)
            example:
              content: |
                BEGIN:VCALENDAR
                VERSION:2.0
                BEGIN:VEVENT
                UID:imported-event@example.com
                DTSTART:20260301T190000
                DTEND:20260301T220000
                SUMMARY:Imported Event
                END:VEVENT
                END:VCALENDAR
              status: "draft"
              skip_duplicates: true
      responses:
        '200':
          description: Import results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  imported:
                    type: integer
                    description: Number of events imported
                  skipped:
                    type: integer
                    description: Number of events skipped (duplicates)
                  errors:
                    type: array
                    items:
                      type: string
                    description: Error messages for failed imports
              example:
                success: true
                imported: 5
                skipped: 2
                errors: []
        '400':
          description: Missing or invalid content
        '403':
          $ref: '#/components/responses/Forbidden'

  /checkin/{occurrence_id}/{token}:
    post:
      tags:
        - Check-In
      summary: Check in an attendee
      security: []
      description: |
        Process attendee check-in using the occurrence ID and security token.
        Supports partial check-ins for group registrations.
      operationId: checkInAttendee
      parameters:
        - name: occurrence_id
          in: path
          required: true
          description: Occurrence ID
          schema:
            type: integer
        - name: token
          in: path
          required: true
          description: Security token (64-character hex string)
          schema:
            type: string
            pattern: '^[a-f0-9]{64}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - attendee_id
              properties:
                attendee_id:
                  type: integer
                  description: Attendee ID to check in
                quantity:
                  type: integer
                  description: Number of guests to check in (for partial check-ins)
                  default: 1
                  minimum: 1
            example:
              attendee_id: 156
              quantity: 2
      responses:
        '200':
          description: Check-in successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckInResult'
              example:
                success: true
                attendee_id: 156
                checked_in_count: 2
                fully_checked_in: false
                message: "Checked in 2 of 4 guests"
        '400':
          description: Invalid request or already checked in
          content:
            application/json:
              example:
                code: "already_checked_in"
                message: "This attendee has already been fully checked in."
                data:
                  status: 400
        '403':
          description: Invalid token
          content:
            application/json:
              example:
                code: "invalid_token"
                message: "The check-in token is invalid or expired."
                data:
                  status: 403
        '404':
          $ref: '#/components/responses/NotFound'

  /checkin/{occurrence_id}/{token}/list:
    get:
      tags:
        - Check-In
      summary: Get attendee list for check-in
      security: []
      description: Returns the list of attendees for an occurrence
      operationId: getCheckInList
      parameters:
        - name: occurrence_id
          in: path
          required: true
          description: Occurrence ID
          schema:
            type: integer
        - name: token
          in: path
          required: true
          description: Security token
          schema:
            type: string
            pattern: '^[a-f0-9]{64}$'
        - name: search
          in: query
          description: Search by name or email
          schema:
            type: string
      responses:
        '200':
          description: Attendee list with check-in status
          content:
            application/json:
              schema:
                type: object
                properties:
                  attendees:
                    type: array
                    items:
                      $ref: '#/components/schemas/CheckInAttendee'
                  stats:
                    type: object
                    properties:
                      total:
                        type: integer
                      checked_in:
                        type: integer
                      remaining:
                        type: integer
              example:
                attendees:
                  - id: 156
                    name: "John Smith"
                    email: "john@example.com"
                    quantity: 4
                    checked_in: true
                    checked_in_count: 2
                    ticket_type: "General Admission"
                  - id: 157
                    name: "Jane Doe"
                    email: "jane@example.com"
                    quantity: 2
                    checked_in: false
                    checked_in_count: 0
                    ticket_type: "VIP"
                stats:
                  total: 6
                  checked_in: 2
                  remaining: 4
        '403':
          description: Invalid token
        '404':
          $ref: '#/components/responses/NotFound'

  /check-in/{occurrence_id}:
    get:
      tags:
        - Check-In (Admin)
      summary: List attendees for check-in
      description: Returns the attendee list for an occurrence (admin-authenticated)
      operationId: adminGetCheckInList
      security:
        - WordPressCookie: []
      parameters:
        - name: occurrence_id
          in: path
          required: true
          schema:
            type: integer
        - name: search
          in: query
          description: Filter by name or email
          schema:
            type: string
      responses:
        '200':
          description: Attendee list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CheckInAttendee'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /check-in/{id}/toggle:
    post:
      tags:
        - Check-In (Admin)
      summary: Toggle check-in status
      description: Toggles between all checked in and none checked in
      operationId: toggleCheckIn
      security:
        - WordPressCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: Attendee ID
          schema:
            type: integer
      responses:
        '200':
          description: Updated check-in state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCheckInResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /check-in/{id}/check-in:
    post:
      tags:
        - Check-In (Admin)
      summary: Mark attendee as checked in
      description: Marks all guests as checked in
      operationId: markCheckedIn
      security:
        - WordPressCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: Attendee ID
          schema:
            type: integer
      responses:
        '200':
          description: Updated check-in state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCheckInResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Check-In (Admin)
      summary: Undo check-in
      description: Resets the check-in count to zero
      operationId: markNotCheckedIn
      security:
        - WordPressCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: Attendee ID
          schema:
            type: integer
      responses:
        '200':
          description: Reset check-in state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCheckInResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /check-in/{id}/increment:
    post:
      tags:
        - Check-In (Admin)
      summary: Increment check-in count
      description: Increments the checked-in count by 1
      operationId: incrementCheckIn
      security:
        - WordPressCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: Attendee ID
          schema:
            type: integer
      responses:
        '200':
          description: Updated check-in state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCheckInResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /check-in/{id}/decrement:
    post:
      tags:
        - Check-In (Admin)
      summary: Decrement check-in count
      description: Decrements the checked-in count by 1
      operationId: decrementCheckIn
      security:
        - WordPressCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: Attendee ID
          schema:
            type: integer
      responses:
        '200':
          description: Updated check-in state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminCheckInResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /check-in/{id}/count:
    put:
      tags:
        - Check-In (Admin)
      summary: Set check-in count
      description: Sets the checked-in count to a specific value
      operationId: setCheckInCount
      security:
        - WordPressCookie: []
      parameters:
        - name: id
          in: path
          required: true
          description: Attendee ID
          schema:
            type: integer
