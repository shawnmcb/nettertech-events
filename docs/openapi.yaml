        - Check-In (Admin)
      summary: Look up attendee by ticket code
      description: |
        Finds the attendee for a ticket code. Supports admin auth
        and token-based public access via checkin_token parameter.
      operationId: lookupByTicket
      security:
        - WordPressCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - ticket_code
                - occurrence_id
              properties:
                ticket_code:
                  type: string
                  pattern: '^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$'
                occurrence_id:
                  type: integer
                checkin_token:
                  type: string
                  description: Token for public access (alternative to admin auth)
                auto_checkin:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Attendee found
          content:
            application/json:
              schema:
                type: object
                properties:
                  attendee_id:
                    type: integer
                  attendee_name:
                    type: string
                  email:
                    type: string
                  quantity:
                    type: integer
                  checked_in_count:
                    type: integer
                  already_checked_in:
                    type: boolean
                  checked_in_at:
                    type: string
                    nullable: true
                  just_checked_in:
                    type: boolean
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
