; Suppress E_DEPRECATED at PHP ini level for @runInSeparateProcess child processes.
;
; thecodingmachine/safe v2.x generates ~160KB of implicit-nullable deprecation
; warnings on PHP 8.4+ when its autoload files are loaded. In PHPUnit child
; processes, these warnings go to stderr and overflow the OS pipe buffer (64KB
; on macOS), causing a deadlock: child blocks on stderr write, parent blocks
; waiting for stdout EOF.
;
; This ini file is loaded by child processes via PHP_INI_SCAN_DIR (set in
; bootstrap.php). It suppresses E_DEPRECATED before any PHP code runs, so
; safe's files load silently. The bootstrap then restores error_reporting(E_ALL)
; after the autoloader finishes.
;
; E_ALL & ~E_DEPRECATED = 32767 - 8192 = 24575
error_reporting = 24575
